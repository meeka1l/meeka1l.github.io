<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Webtoon- My Webtoons</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
        }

        header {
            background-color: #000000;
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid #ff6b6b;
            position: relative;
        }

        .back-button {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            background-color: #ff6b6b;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }

        .back-button:hover {
            background-color: #ff9999;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.2em;
            color: #cccccc;
        }

        nav {
            background-color: #2a2a2a;
            padding: 15px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav a {
            color: #ff6b6b;
            text-decoration: none;
            margin: 0 15px;
            font-size: 1.1em;
            font-weight: bold;
        }

        nav a:hover {
            color: #ff9999;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .episode-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .episode-card {
            background-color: #2a2a2a;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s;
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .episode-card:hover {
            transform: translateY(-5px);
        }

        .episode-thumbnail {
            width: 100%;
            height: 200px;
            background-color: #3a3a3a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3em;
            color: #ff6b6b;
        }

        .episode-info {
            padding: 15px;
        }

        .episode-info h3 {
            margin-bottom: 5px;
        }

        .episode-info p {
            color: #cccccc;
            font-size: 0.9em;
        }

        .about-section {
            background-color: #2a2a2a;
            padding: 30px;
            border-radius: 10px;
            margin-top: 30px;
        }

        .about-section h2 {
            color: #ff6b6b;
            margin-bottom: 15px;
        }

        footer {
            background-color: #000000;
            text-align: center;
            padding: 20px;
            margin-top: 50px;
            color: #cccccc;
        }
    </style>
</head>
<body>
    <header>
        <a href="../index.html" class="back-button">← All Series</a>
        <h1>A Grey Life</h1>
        <p>Slice of life</p>
    </header>

    <nav>
        <a href="#about">About</a>
        <a href="#episodes">Episodes</a>
        <a href="../index.html">All Series</a>
    </nav>

    <div class="container">
        <div class="about-section" id="about">
            <h2>About This Series</h2>
            <p>A prototype for an interactive webtoon where the reader's decisions affect the storyline.</p>
         </div>

        <h2 style="margin-top: 40px; margin-bottom: 10px;" id="episodes">Episodes</h2>
        
        <div class="episode-grid">
            <a href="episode1.html" class="episode-card">
                <div class="episode-thumbnail">01</div>
                <div class="episode-info">
                    <h3>Prototype 1</h3>
                    <p></p>
                </div>
            </a>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 Meekail. All rights reserved.</p>
    </footer>
</body>
</html>
